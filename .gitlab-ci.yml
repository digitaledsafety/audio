default:
  image: ruby:3.2

variables:
  JEKYLL_ENV: production
  LC_ALL: C.UTF-8

stages:
  - build
  - deploy

pages:
  stage: deploy
  script:
    - gem install bundler
    - bundle install
    - bundle exec jekyll build -d public --baseurl "$JEKYLL_BASEURL"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "Production site available at - ${CI_PAGES_URL}"
      else
        echo "Branch preview available at - ${CI_PAGES_URL}/${CI_COMMIT_REF_SLUG}"
      fi
  pages:
    path_prefix: "$PAGES_PATH_PREFIX"
  artifacts:
    paths:
      - public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      variables:
        JEKYLL_BASEURL: ""
        PAGES_PATH_PREFIX: ""
    - if: '($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "mirror") && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      variables:
        JEKYLL_BASEURL: "/$CI_COMMIT_REF_SLUG"
        PAGES_PATH_PREFIX: "$CI_COMMIT_REF_SLUG"
